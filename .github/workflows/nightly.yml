name: Nightly Stability Check

on:
  schedule:

    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  test-only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Tests

        run: ./gradlew --no-daemon test